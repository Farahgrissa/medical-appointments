# Intégration continue : à chaque push / pull request, GitHub compile le front
# et lance la suite de tests. Une PR vers main ne devrait être fusionnée que si ce job est vert.

name: CI

on:
  push:
    branches: [main, devops]
  pull_request:
    branches: [main]
  # Bouton "Run workflow" dans l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche annule le run précédent encore en cours
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== PHP =====
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip, fileinfo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # ===== Front =====
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Le build doit précéder les tests : app.blade.php appelle @vite,
      # qui a besoin de public/build/manifest.json
      - name: Build front-end
        run: npm run build

      # ===== Tests =====
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml force SQLite en mémoire, cache/session "array" et mails "array"
      - name: Run tests
        run: php artisan test
